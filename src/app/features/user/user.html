<div class="d-flex justify-content-between">
  <div></div>
  <button matButton="filled" color="primary" class="" (click)="onAddUser()">Add User</button>
</div>

<table mat-table [dataSource]="userDataSource" class="mat-elevation-z2">

  <!-- Your existing columns -->

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>S.No</th>
    <td mat-cell *matCellDef="let user; let i=index">
      {{ (paginator.pageIndex * paginator.pageSize) + i + 1 }}
    </td>
  </ng-container>

  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let user">
      {{ user.username }}
    </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let user">
      {{ user.email }}
    </td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let user">
      {{ user.role }}
    </td>
  </ng-container>

  <ng-container matColumnDef="star" stickyEnd>
    <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
    <td mat-cell *matCellDef="let element" [matMenuTriggerFor]="menu" [matMenuTriggerData]="{user: element}">
      <mat-icon>more_vert</mat-icon>
    </td>
  </ng-container>

  <mat-menu #menu="matMenu">
    <ng-template matMenuContent let-user="user">
      <button mat-menu-item (click)="onEditUser(user)">Edit</button>
      <button mat-menu-item (click)="onDeleteUser(user)">Delete</button>
    </ng-template>
  </mat-menu>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <!-- No records -->
  <tr class="mat-row" *matNoDataRow>
    <td class="text-center mat-cell no-records" [attr.colspan]="displayedColumns.length">
      No records found
    </td>
  </tr>


</table>


<mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="5" showFirstLastButtons>
</mat-paginator>
